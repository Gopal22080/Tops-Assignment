<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Contact Form</title>

  <!-- External CSS link -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Contact Form</h2>

<form id="contactForm">

  <label class="label" for="name">Full Name :</label>
  <input class="input-field" type="text" id="name" required>

  <br><br>

  <label class="label" for="email">Email :</label>
  <input class="input-field" type="email" id="email" required>

  <br><br>

  <label class="label" for="message">Message :</label>
  <textarea class="input-field" id="message" rows="5" required></textarea>

  <br><br>

  <button id="submitBtn" type="submit">Submit</button>

</form>

</body>
</html>
